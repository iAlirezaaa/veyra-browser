name: Verify extension
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: python3 -m json.tool manifest.json > /dev/null
      - run: npm run package
      - run: cd dist && sha256sum -c SHA256SUMS.txt
      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: veyra-browser-install
          path: |
            dist/veyra-v*-chrome.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish installable ZIP to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/veyra-v*-chrome.zip dist/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: publish installable Chrome ZIP [skip ci]"
            git push
          fi
