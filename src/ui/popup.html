<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f8fa">
<title>Veyra</title>
<style>
:root{color-scheme:light;--bg:#f7f8fa;--surface:#fff;--ink:#1d2430;--muted:#667284;--border:#e6eaf3;--accent:#536bf3;--text-on-accent:white}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11161d;--surface:#1b222d;--ink:#f1f4fb;--muted:#b6c0cf;--border:#2d3541;--accent:#92a2ff;--text-on-accent:#11161d}
@media(prefers-color-scheme:dark){:root:not([data-theme]){color-scheme:dark;--bg:#11161d;--surface:#1b222d;--ink:#f1f4fb;--muted:#b6c0cf;--border:#2d3541;--accent:#92a2ff;--text-on-accent:#11161d}}
*{box-sizing:border-box}body{min-width:252px;margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
h2{margin:0;font-size:23px;letter-spacing:-1px}p{color:var(--muted);font-size:12px;line-height:1.65;margin:9px 0 19px}button{display:block;width:100%;padding:12px;border:1px solid var(--accent);border-radius:10px;margin-top:9px;background:var(--accent);color:var(--text-on-accent);font-size:12px;font-weight:700;cursor:pointer}button.secondary{background:var(--surface);color:var(--ink);border-color:var(--border)}button:hover{filter:brightness(1.05)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#status{font-size:11px;color:var(--muted);margin-top:10px;min-height:14px}
</style>
<script type="module" src="popup.js"></script>
</head><body>
<h2>veyra.</h2>
<p id="caption">A calmer place for everything in your browser.</p>
<button id="open"><span id="openLabel">Open workspace</span></button>
<button class="secondary" id="save"><span id="saveLabel">Bookmark current tab</span></button>
<button class="secondary" id="themeToggle" aria-label="Switch to dark mode"><span id="themeLabel">Dark mode</span></button>
<div id="status" role="status" aria-live="polite"></div>
</body></html>
